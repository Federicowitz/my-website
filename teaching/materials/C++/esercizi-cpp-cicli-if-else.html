<!DOCTYPE html>

    <section class="note"><h2>Indicazioni generali</h2><ul id="rulesList"></ul></section>
    <section id="exerciseList" class="exercise-grid"></section>
  </main>
  <script>
    window.exercisePageConfig = {
      storageKey: "cpp-loops-if-else-exercises-progress-v1",
      rules: [
        "Scegli il ciclo piu adatto: while, do while oppure for.",

      exercises: [
        ["1. Pari e dispari in intervallo", "Filtri", "Leggi due estremi e stampa quali numeri sono pari e quali dispari.", ["Leggi inizio e fine.", "Scorri l'intervallo.", "Per ogni numero stampa pari o dispari."], ["Usa % 2 dentro il ciclo."]],
