<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>13. Calcolatrice con select</title>
<meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../../reader.css"></head>
<body>
  <h1>Calcolatrice</h1>

  <input id="number1" type="text" placeholder="Primo numero">
  <input id="number2" type="text" placeholder="Secondo numero">

  <select id="operation">
    <option value="somma">Somma</option>
    <option value="sottrazione">Sottrazione</option>
    <option value="moltiplicazione">Moltiplicazione</option>
    <option value="divisione">Divisione</option>
  </select>

  <button id="button" type="button">Calcola</button>
  <div id="result"></div>

  <script>
    const number1 = document.getElementById("number1");
    const number2 = document.getElementById("number2");
    const operation = document.getElementById("operation");
    const button = document.getElementById("button");
    const result = document.getElementById("result");

    button.onclick = () => {
      const value1 = parseFloat(number1.value);
      const value2 = parseFloat(number2.value);
      const selectedOperation = operation.value;

      if (Number.isNaN(value1) || Number.isNaN(value2)) {
        result.innerText = "Errore: inserisci due numeri validi.";
        return;
      }

      let total = 0;

      switch (selectedOperation) {
        case "somma":
          total = value1 + value2;
          break;

        case "sottrazione":
          total = value1 - value2;
          break;

        case "moltiplicazione":
          total = value1 * value2;
          break;

        case "divisione":
          if (value2 === 0) {
            result.innerText = "Errore: divisione per zero.";
            return;
          }

          total = value1 / value2;
          break;

        default:
          result.innerText = "Errore: operazione non valida.";
          return;
      }

      result.innerText = `Risultato: ${total}`;
    };
  </script>
</body>
</html>
